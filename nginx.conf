# HTTP: serve the ACME challenge, redirect everything else to HTTPS.
server {
    listen 80 default_server;
    server_name _;

    # Certbot webroot — must stay on HTTP and must not redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name revayat.shop www.revayat.shop;

    ssl_certificate     /etc/letsencrypt/live/revayat.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/revayat.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Product images and uploads are large; let nginx buffer them properly.
    client_max_body_size 10m;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Drives the `secure` cookie flag in lib/cart.ts and lib/admin.ts —
        # cookies break if this is missing or wrong.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
