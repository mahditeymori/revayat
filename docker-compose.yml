services:
  web:
    # Production pulls a prebuilt image from GHCR (see .github/workflows/deploy.yml).
    # WEB_IMAGE pins the exact tag deployed, which is what makes rollback a retag
    # rather than a rebuild. Local dev overrides this via docker-compose.override.yml.
    image: ${WEB_IMAGE:-ghcr.io/mahditeymori/revayat-web:latest}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DATA_DIR: /app/data
    volumes:
      # Production data: catalog JSON, orders, and uploaded product images.
      # Nothing here is baked into the image — see apps/web/docker-entrypoint.sh.
      - revayat_data:/app/data
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - web
      # certbot writes the placeholder certificate nginx needs to boot
      - certbot
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-entrypoint.sh:/nginx-entrypoint.sh:ro
      # not :ro — the entrypoint writes a placeholder cert here on first boot
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot:ro
    entrypoint: ['/bin/sh', '/nginx-entrypoint.sh']

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    environment:
      CERT_DOMAIN: ${CERT_DOMAIN:-revayat.shop}
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - ./certbot-entrypoint.sh:/certbot-entrypoint.sh:ro
    entrypoint: ['/bin/sh', '/certbot-entrypoint.sh']

volumes:
  revayat_data:
  certbot_conf:
  certbot_www:
