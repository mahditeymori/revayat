# Local development. Docker Compose loads this automatically on top of
# docker-compose.yml, so `docker compose up` builds from source instead of
# pulling the production image from GHCR.
#
# This file must NOT be present on the production server — deploy.sh uses
# `-f docker-compose.yml` explicitly so it is ignored there either way.
services:
  db:
    # Exposed on the host so `npm run db:generate` / `db:migrate` / `db:studio`
    # (run from apps/web, outside the container) can reach it via
    # DATABASE_URL=postgresql://...@localhost:5432/... in .env.local.
    ports:
      - '5432:5432'

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_ENAMAD_CODE: ${NEXT_PUBLIC_ENAMAD_CODE}
    image: revayat-web:dev
